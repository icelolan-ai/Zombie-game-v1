name: Game checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8080 > /tmp/outbreak-server.log 2>&1 &
          node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-browser-checks
          path: test-output/
